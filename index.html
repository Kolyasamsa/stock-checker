<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка остатков</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,Segoe UI,Arial,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:28px}
h1{margin:0 0 8px;font-size:30px}
.sub{color:#667085;margin-bottom:24px}
.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border:1px solid #e3e7ef;border-radius:14px;padding:16px;box-shadow:0 2px 8px #00000008}
label{font-weight:700;display:block;margin-bottom:9px}
.req{color:#d92d20}
textarea{width:100%;height:300px;resize:vertical;border:1px solid #cfd6e4;border-radius:10px;padding:12px;font:13px/1.45 Consolas,monospace;outline:none}
textarea:focus{border-color:#6b7cff;box-shadow:0 0 0 3px #6b7cff18}
button{border:0;border-radius:10px;background:#315efb;color:white;padding:13px 22px;font-weight:700;font-size:15px;cursor:pointer}
button:hover{background:#244bd4}
.actions{display:flex;align-items:center;gap:14px;margin:18px 0}
.error{color:#b42318;font-weight:600}
.hidden{display:none}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}
.stat{background:#fff;border:1px solid #e3e7ef;border-radius:12px;padding:15px}
.stat .n{font-size:25px;font-weight:800;margin-top:5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
input,select{border:1px solid #cfd6e4;border-radius:9px;padding:10px 12px;background:#fff}
input{min-width:280px}
.filters button{background:#fff;color:#344054;border:1px solid #d0d5dd;padding:9px 13px}
.filters button.active{background:#315efb;color:#fff;border-color:#315efb}
.tablebox{overflow:auto;background:#fff;border:1px solid #e3e7ef;border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{padding:11px 12px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{background:#f8f9fc;cursor:pointer;position:sticky;top:0}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}
.ok{background:#ecfdf3;color:#067647}.bad{background:#fef3f2;color:#b42318}.zero{background:#fff7ed;color:#c2410c}
.notfound{margin-top:18px}
.notfound ul{margin:8px 0 0;padding-left:22px}
@media(max-width:900px){.inputs{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.wrap{padding:15px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Проверка остатков</h1>
  <div class="sub">Вставьте таблицы → нажмите «Проверить остатки». Данные обрабатываются прямо в браузере.</div>

  <div class="inputs">
    <div class="card">
      <label>Остатки на сегодня <span class="req">*</span></label>
      <textarea id="stock" placeholder="| Магнит | 13 816,000 |
| --- | --- |
| БЛИННЫЙ 0,6 (10 сут) ФАНТЭЛЬ | 172,000 |
| Итог | 13 816,000 |"></textarea>
    </div>
    <div class="card">
      <label>Заказано <span class="req">*</span></label>
      <textarea id="orders" placeholder="| Магнит | 5 000,000 |
| --- | --- |
| БЛИННЫЙ 0,6 (10 сут) ФАНТЭЛЬ | 20,000 |
| Итог | 5 000,000 |"></textarea>
    </div>
    <div class="card">
      <label>Реализация с предыдущих дней <span style="font-weight:400;color:#667085">(необязательно)</span></label>
      <textarea id="sales" placeholder="Можно оставить пустым"></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="check">Проверить остатки</button>
    <span id="error" class="error"></span>
  </div>

  <section id="results" class="hidden">
    <div class="summary">
      <div class="stat">Всего товаров<div class="n" id="total">0</div></div>
      <div class="stat">Достаточно<div class="n" id="enough">0</div></div>
      <div class="stat">Дефицит<div class="n" id="deficit">0</div></div>
      <div class="stat">Нулевой остаток<div class="n" id="zero">0</div></div>
      <div class="stat">Не найдено в остатках<div class="n" id="missingCount">0</div></div>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="active" data-filter="all">Все</button>
        <button data-filter="deficit">Дефицит</button>
        <button data-filter="enough">Достаточно</button>
        <button data-filter="zero">Нулевой остаток</button>
      </div>
      <input id="search" placeholder="Поиск по номенклатуре">
      <select id="sort">
        <option value="name">Сортировка: номенклатура</option>
        <option value="stock">Сортировка: остаток</option>
        <option value="order">Сортировка: заказано</option>
        <option value="afterOrder">Сортировка: после заказа</option>
        <option value="sales">Сортировка: реализация</option>
        <option value="final">Сортировка: конечный остаток</option>
      </select>
      <select id="direction">
        <option value="asc">↑ по возрастанию</option>
        <option value="desc">↓ по убыванию</option>
      </select>
    </div>

    <div class="tablebox">
      <table>
        <thead><tr>
          <th data-sort="name">Номенклатура</th>
          <th data-sort="stock">Остаток</th>
          <th data-sort="order">Заказано</th>
          <th data-sort="afterOrder">После заказа</th>
          <th data-sort="sales">Реализация</th>
          <th data-sort="final">Конечный остаток</th>
          <th>Статус</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="card notfound" id="notfoundBox">
      <b>Не найдено в остатках</b>
      <ul id="notfound"></ul>
    </div>
  </section>
</div>

function parseNumber(v){
  let s = String(v ?? "").trim().replace(/\u00a0/g," ").replace(/\s/g,"");
  s = s.replace(",", ".");
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function looksLikeHeader(name){
  const s = String(name || "").trim().toLocaleLowerCase("ru-RU");
  return s === "итог" ||
    s === "магнит" ||
    s.includes("торговый дом") ||
    s.includes("логистика") ||
    s === "магазин" ||
    s === "наименование";
}

function parseTable(text){
  const map = new Map();
  const lines = String(text || "").split(/\r?\n/);
  let parsedDataRows = 0;

  for(let lineIndex = 0; lineIndex < lines.length; lineIndex++){
    const raw = lines[lineIndex];
    const line = raw.trim();
    if(!line) continue;

    let name = "";
    let qty = "";

    // 1. Markdown / pipe table:
    if(line.includes("|")){
      const cells = line.split("|").map(x=>x.trim());
      if(cells.length < 3) continue;
      name = cells[1];
      qty = cells[2];
    }
    // 2. Tab-separated data (обычная вставка из Excel):
    else if(raw.includes("\t")){
      const cells = raw.split("\t").map(x=>x.trim()).filter((_,i)=>i===0 || true);
      if(cells.length < 2) continue;
      name = cells[0];
      qty = cells[cells.length - 1];
    }
    // 3. Plain text with spaces between columns:
    //    берём последнее число как количество.
    else{
      const m = line.match(/^(.*?)\s+(-?\d[\d\s\u00A0]*(?:[.,]\d+)?)\s*$/);
      if(!m) continue;
      name = m[1].trim();
      qty = m[2].trim();
    }

    if(!name || /^-+$/.test(name) || /^:?-+:?$/.test(name)) continue;
    if(/^итог$/i.test(name)) continue;

    const n = parseNumber(qty);
    if(n === null) continue;

    // В некоторых отчётах первая строка — название магазина + общий итог.
    // Не считаем её товаром.
    if(parsedDataRows === 0 && looksLikeHeader(name)){
      continue;
    }

    map.set(name, (map.get(name)||0) + n);
    parsedDataRows++;
  }

  return map;
}

function normalize(name){
  let s = String(name).trim().replace(/\s+/g," ");
  // Rules are taken from columns F:G of "форматирование названий".
  // First matching rule wins, preserving the source order.
  for(const r of RULES){
    if(!r.find) continue;
    const idx = s.toLocaleLowerCase("ru-RU").indexOf(r.find.toLocaleLowerCase("ru-RU"));
    if(idx !== -1){
      return s.slice(0,idx) + r.replace + s.slice(idx + r.find.length);
    }
  }
  return s;
}

function normalizeMap(map){
  const out = new Map();
  for(const [name,qty] of map){
    const n = normalize(name);
    out.set(n, (out.get(n)||0) + qty);
  }
  return out;
}

function fmt(n){
  return n.toLocaleString("ru-RU",{minimumFractionDigits:3,maximumFractionDigits:3});
}

function status(row){
  if(row.stock === 0) return ["Нулевой остаток","zero"];
  if(row.final < 0) return ["Дефицит","bad"];
  return ["Достаточно","ok"];
}

  const sales = normalizeMap(parseTable(salesText));

  rows = [];
  for(const [name,stockQty] of stock){
    const orderQty = orders.get(name)||0;
    const salesQty = sales.get(name)||0;
    rows.push({
      name, stock:stockQty, order:orderQty,
      afterOrder:stockQty-orderQty,
      sales:salesQty,
      final:stockQty-orderQty-salesQty
    });
  }

  const missing = [];
  for(const [name,qty] of orders){
    if(!stock.has(name)) missing.push({name,qty,type:"Заказано"});
  }
  for(const [name,qty] of sales){
    if(!stock.has(name) && !missing.some(x=>x.name===name))
      missing.push({name,qty,type:"Реализация"});
  }

  document.getElementById("total").textContent = rows.length;
  document.getElementById("enough").textContent = rows.filter(r=>status(r)[0]==="Достаточно").length;
  document.getElementById("deficit").textContent = rows.filter(r=>status(r)[0]==="Дефицит").length;
  document.getElementById("zero").textContent = rows.filter(r=>status(r)[0]==="Нулевой остаток").length;
  document.getElementById("missingCount").textContent = missing.length;

  const ul = document.getElementById("notfound");
  ul.innerHTML = "";
  for(const x of missing){
    const li=document.createElement("li");
    li.textContent=`${x.name} — ${fmt(x.qty)} (${x.type})`;
    ul.appendChild(li);
  }
  document.getElementById("notfoundBox").style.display = missing.length ? "block" : "none";

  document.getElementById("results").classList.remove("hidden");
  render();
}

function render(){
  const q=document.getElementById("search").value.trim().toLocaleLowerCase("ru-RU");
  const dir=document.getElementById("direction").value==="asc"?1:-1;

  let data=rows.filter(r=>{
    const [st]=status(r);
    const okFilter=currentFilter==="all" ||
      (currentFilter==="deficit"&&st==="Дефицит") ||
      (currentFilter==="enough"&&st==="Достаточно") ||
      (currentFilter==="zero"&&st==="Нулевой остаток");
    return okFilter && r.name.toLocaleLowerCase("ru-RU").includes(q);
  });

  data.sort((a,b)=>{
    const av=a[sortKey], bv=b[sortKey];
    if(typeof av==="string") return av.localeCompare(bv,"ru",{sensitivity:"base"})*dir;
    return (av-bv)*dir;
  });

  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";
  for(const r of data){
    const [st,cls]=status(r);
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${escapeHtml(r.name)}</td>
      <td>${fmt(r.stock)}</td><td>${fmt(r.order)}</td><td>${fmt(r.afterOrder)}</td>
      <td>${fmt(r.sales)}</td><td>${fmt(r.final)}</td>
      <td><span class="badge ${cls}">${st}</span></td>`;
    tbody.appendChild(tr);
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

document.getElementById("check").addEventListener("click",calculate);
document.getElementById("search").addEventListener("input",render);
document.getElementById("sort").addEventListener("change",e=>{sortKey=e.target.value;render()});
document.getElementById("direction").addEventListener("change",render);

document.querySelectorAll(".filters button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    currentFilter=btn.dataset.filter;
    render();
  });
});
document.querySelectorAll("th[data-sort]").forEach(th=>{
  th.addEventListener("click",()=>{
    sortKey=th.dataset.sort;
    document.getElementById("sort").value=sortKey;
    render();
  });
});
</script>
</body>
</html>
